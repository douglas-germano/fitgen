# Local development stack (Colima / Docker): Postgres + Flask API on :5002
services:
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fitgen
      POSTGRES_PASSWORD: fitgen
      POSTGRES_DB: fitgen_dev
    volumes:
      - fitgen_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitgen -d fitgen_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://fitgen:fitgen@db:5432/fitgen_dev
      PORT: "5002"
      FRONTEND_URL: "https://web.fitgen.pro"
    ports:
      - "5003:5002"
    volumes:
      - ./instance:/app/instance
      - ./app/static/uploads:/app/app/static/uploads
    depends_on:
      db:
        condition: service_healthy

volumes:
  fitgen_pgdata:
