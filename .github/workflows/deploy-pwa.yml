# Publishes the app's web version (web.fitgen.pro, Cloudflare Worker "fitgen-pwa") on every push to main
# that touches the mobile app. Needs the CLOUDFLARE_API_TOKEN repository secret ("Edit Cloudflare Workers").
name: Deploy web app (web.fitgen.pro)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '!mobile/android/**'
      - '!mobile/ios/**'
      - '!mobile/store-assets/**'
      - '.github/workflows/deploy-pwa.yml'
  workflow_dispatch:

concurrency:
  group: deploy-pwa
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:pwa
        env:
          EXPO_PUBLIC_COACH_A2UI_DEMO: "1"

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.166.0 deploy --config wrangler.pwa.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 5dc3a4d4c8f10170979cef0a9d04c9ce
