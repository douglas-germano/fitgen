<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
html,body{width:1024px;height:500px;overflow:hidden;background:#111416;font-family:'Plus Jakarta Sans',sans-serif}
.bg{position:absolute;inset:0;background:
 radial-gradient(520px 420px at 830px 250px, rgba(161,236,3,.28), transparent 70%),
 radial-gradient(380px 300px at 40px 520px, rgba(161,236,3,.10), transparent 70%), #111416}
.left{position:absolute;left:72px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:22px}
.brand{display:flex;align-items:center;gap:16px}
.brand img{height:64px}
.brand span{color:#fff;font-weight:800;font-size:50px;letter-spacing:-1.5px}
h1{color:#fff;font-weight:800;font-size:44px;line-height:1.08;letter-spacing:-1.4px}
h1 em{font-style:normal;color:#a1ec03}
p{color:#b9c0c7;font-weight:500;font-size:21px;line-height:1.4}
.chips{display:flex;gap:10px;margin-top:4px}
.chips b{font-weight:700;font-size:15px;color:#111416;background:#a1ec03;border-radius:999px;padding:8px 16px}
.chips b.o{background:transparent;color:#e6eaee;border:1.5px solid #3a4046}
.phone{position:absolute;left:700px;top:46px;width:236px;height:520px;border-radius:38px;background:#000;padding:9px;
 transform:rotate(-6deg);box-shadow:0 30px 60px rgba(0,0,0,.55),0 0 0 2px #2a2f34}
.phone .scr{width:100%;height:100%;border-radius:30px;overflow:hidden;background:#fff}
.phone img{width:100%;display:block}
</style></head><body><div class="bg"></div>
<div class="left">
 <div class="brand"><img src="mark.png"><span>FitGen</span></div>
 <h1>Treino e dieta <em>personalizados</em> com IA</h1>
 <p>Um plano que se ajusta à sua rotina,<br>com o coach Otto ao seu lado.</p>
 <div class="chips"><b>Treinos</b><b class="o">Plano alimentar</b><b class="o">Evolução</b></div>
</div>
<div class="phone"><div class="scr"><img src="home.png"></div></div>
</body></html>
